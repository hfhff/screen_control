plugins { id 'com.android.application' }

android {
    namespace 'com.monthlyblocker'
    compileSdk 36
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId 'com.monthlyblocker'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output -> outputFileName = 'control.apk' }
    }
}
